    Projects:
      - name: Humanoid ice skating with reinforcement learning (Jul 2026 – present)
        url: https://youtu.be/F5EM3TZRRbE
        summary: >-
          I train a simulated Unitree G1 to skate with PPO on thin passive blades, using a contact model I
          set up so each blade glides along its length and grips sideways. Trained in mjlab with no motion
          capture, reference motion or imitation reward, policies from three seeds had mean speed errors of
          0.11 and 0.16 m/s at 0.6 and 0.9 m/s commands, with 3 to 4 cm/s of sideways blade slip.
          Everything so far is in simulation. The linked video shows my newer Isaac Lab version, which is
          trained to follow a reference gait recorded from an earlier policy of mine that I had shaped
          toward a human-like stroke.

      - name: Humanoid bimanual lifting with residual AMP-PPO (May 2026 – Jul 2026)
        url: https://github.com/shuayyy/humanoid-amp-ppo
        summary: >-
          This is a collaboration with Mohamed Shuaib Nasurudeen, who built the training stack; the code
          is in his repository. A Unitree G1 learns in MuJoCo simulation to grasp a box with both arms and
          lift it. My part was the residual version of the lift policy, a second network whose output is
          added to the actions of the frozen locomotion policy. I set it up, made the curricula adapt to
          the lift success rate and wrote most of the posture rewards. In simulation the converged policies
          hold the box at the goal height, within 3 cm of the target position. A lifting policy from the
          project has also run on the real G1, where it lifted a box (a qualitative result).

      - name: Conditional flow matching policies for robot manipulation (Apr 2026 – May 2026)
        url: https://github.com/souravselvaraj/Robomimic-Flowmatching
        summary: >-
          I wrote a Conditional Flow Matching policy for robomimic and compared it with Diffusion Policy on
          the same U-Net backbone, on five simulated tasks from low-dimensional state with three seeds each.
          Success was comparable. Flow matching was ahead on Square and slightly behind on Tool Hang and
          Transport, and both reached 100% on Lift and Can. With 10 Euler steps it samples an action chunk
          about 11× faster than Diffusion Policy's 100-step DDPM sampler.

      - name: Acrobatic quadrotor flight with L1 adaptation (Oct 2025 – Dec 2025)
        url: https://github.com/souravselvaraj/crazyflie-se3-l1
        summary: >-
          For my Robot Control course, I wrote an SE(3) geometric controller with an L1 adaptive layer for
          a simulated Crazyflie in ROS 2 and Gazebo. It flies a 360° roll flip in place and recovers to
          hover. In one logged run, position RMSE was 2.2 cm in x and y and 7.0 cm in z, and the L1 layer
          cancelled 94%, 86% and 71% of an injected step torque on roll, pitch and yaw. I have not flown
          it on hardware.

      - name: Autonomous rover for the ISRO Robotics Challenge 2024 (Dec 2022 – Aug 2024)
        summary: >-
          A six-wheeled rocker-bogie rover that mapped terrain with ORB-SLAM, planned kinodynamic paths
          and ran on custom control electronics.

      - name: Additional projects
        summary: >-
          Visuomotor imitation learning on robosuite's Pick-and-Place Can task from two camera views,
          training a transformer behavior-cloning policy and a Diffusion Policy
          ([code](https://github.com/souravselvaraj/Visuomotor-Imitation-Learning)). Task and motion
          planning with PDDL and OMPL.

