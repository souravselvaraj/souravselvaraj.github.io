# NOTE: the al_folio_cv rendercv renderer dispatches templates on exact section
# names: Education, Experience (+Volunteer), Publications, Projects, Skills,
# Languages, Interests, Certificates, Awards, References. Any other section name
# falls back to a generic renderer that only understands `bullet:` / `label:`
# entries. Authors are not rendered for Publications entries (folded into
# summary), and Education has no score field (GPA goes in highlights).
# The web CV is a concise overview; the full detail lives in the PDF (cv_pdf).
