  summary: >-
    I am an M.S. student in Robotics Engineering at WPI, working with Dr. Mahdi Agheli in the ALMaS
    Research Group. I study how legged robots choose where to touch and how hard to push. I lead SCRUB,
    in which our armless Unitree Go1 presses a tool against a wall or column that the robot has no model
    of and slides the tool along it. With Owen Sullivan, I also work on GaitNet, a learned planner that picks each
    footstep for a quadruped crossing ground full of holes. My research interests are legged robotics,
    whole-body control and robot learning, and I am applying to PhD programs for Fall 2027.

