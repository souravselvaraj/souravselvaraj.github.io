    Projects:
      - name: Humanoid ice skating with reinforcement learning (Jul 2026 – present)
        url: https://youtu.be/F5EM3TZRRbE
        summary: >-
          I train a Unitree G1 with PPO to skate on thin passive blades. Everything so far is in
          simulation. The linked video shows my newer Isaac Lab version.

      - name: Humanoid bimanual lifting with residual AMP-PPO (May 2026 – Jul 2026)
        url: https://github.com/shuayyy/humanoid-amp-ppo
        summary: >-
          Mohamed Shuaib Nasurudeen built the training stack, and the code is in his repository. My part
          was the residual lift policy. A policy from the project lifted a box on the real G1 (qualitative only).

      - name: Conditional flow matching policies for robot manipulation (Apr 2026 – May 2026)
        url: https://github.com/souravselvaraj/Robomimic-Flowmatching
        summary: >-
          I wrote a flow matching policy for robomimic. Its success was comparable to Diffusion Policy's on
          five simulated tasks. With 10 Euler steps, it samples actions about 11× faster than Diffusion Policy's
          100-step DDPM sampler.

      - name: Acrobatic quadrotor flight with L1 adaptation (Oct 2025 – Dec 2025)
        url: https://github.com/souravselvaraj/crazyflie-se3-l1
        summary: >-
          For my Robot Control course, I wrote an SE(3) controller with L1 adaptation for a Crazyflie. In ROS 2
          and Gazebo simulation, it flies a 360° roll flip. I have not flown it on hardware.

      - name: Autonomous rover for the ISRO Robotics Challenge 2024 (Dec 2022 – Aug 2024)
        summary: >-
          Our six-wheeled rocker-bogie rover mapped terrain with ORB-SLAM, planned kinodynamic paths and ran
          on custom control electronics.

      - name: Additional projects
        summary: >-
          Visuomotor imitation learning on robosuite's Pick-and-Place Can task, with transformer behavior
          cloning and Diffusion Policy ([code](https://github.com/souravselvaraj/Visuomotor-Imitation-Learning)).
          Task and motion planning with PDDL and OMPL.

    Teaching Experience:
