    Projects:
      - name: Simulated Ice-Skating Locomotion for Humanoids via Blade-Contact RL (Jul 2026 – present)
        url: https://youtu.be/F5EM3TZRRbE
        summary: >-
          Unitree G1 trained with PPO in MuJoCo to skate on passive 3 mm blades without imitation data; the
          skating gait emerges from anisotropic blade–ice contact. Tracks a 0.9 m/s command within 0.09 m/s
          at 94% single support.

      - name: Simulated Bimanual Lifting for Humanoids via Residual AMP–PPO (May 2026 – Jul 2026)
        url: https://github.com/shuayyy/humanoid-amp-ppo
        summary: >-
          Unitree G1 trained to lift objects with residual AMP–PPO over a frozen locomotion actor, holding them
          within 3 cm of target using adaptive curricula and dynamics randomization.

      - name: Conditional Flow Matching Policies for Robot Manipulation (Apr 2026 – May 2026)
        url: https://github.com/souravselvaraj/Robomimic-Flowmatching
        summary: >-
          Conditional Flow Matching visuomotor policy built from scratch in robomimic — 11× faster inference
          than 100-step DDPM Diffusion Policy on the same backbone, with equal or higher success on the tasks
          compared head-to-head.

      - name: Acrobatic Quadrotor Control with L1 Adaptive Augmentation (Oct 2025 – Dec 2025)
        url: https://github.com/souravselvaraj/crazyflie-se3-l1
        summary: >-
          SE(3) geometric controller with L1 adaptive augmentation for a Crazyflie 2.1 in ROS 2 simulation
          — 2.2 cm position RMSE, up to 94% of force-step disturbances rejected.

      - name: Autonomous Rover — ISRO Robotics Challenge 2024 (Dec 2022 – Aug 2024)
        summary: >-
          6-wheeled rocker-bogie autonomous rover with ORB-SLAM terrain mapping, kinodynamic path planning,
          and custom control electronics.

      - name: Additional projects
        summary: >-
          Visuomotor imitation learning — Behavior Cloning vs. Diffusion Policy on robosuite
          ([code](https://github.com/souravselvaraj/Visuomotor-Imitation-Learning)); task-and-motion
          planning — PDDL + OMPL block assembly on a Franka Panda.

